name: Build Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK with Code Obfuscation
        env:
          STORE_PASSWORD: "NayliMarketSecure2026!"
          KEY_PASSWORD: "NayliMarketSecure2026!"
          KEY_ALIAS: naylimarket
        run: flutter build apk --release --obfuscate --split-debug-info=symbols/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: billing-pos-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
