name: Publish GitHub Release (OTA Updates)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'رقم الإصدار (مثال: v2.1.0)'
        required: false
        default: ''
      release_notes:
        description: 'سجل التغييرات والملاحظات (Changelog)'
        required: false
        default: 'تحديث رسمي يتضمن إصلاحات عامة وتحسينات في الأداء والاستقرار.'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop Setup & Portable
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC C++ Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Scaffold Windows Platform Files
        run: flutter create --platforms=windows --project-name billing_app .

      - name: Apply Custom Nayli Kiosk Branding, Icon & Executable Name
        shell: powershell
        run: |
          Copy-Item -Path "assets\images\app_icon.ico" -Destination "windows\runner\resources\app_icon.ico" -Force
          (Get-Content "windows\CMakeLists.txt") -replace 'set\(BINARY_NAME "billing_app"\)', 'set(BINARY_NAME "Nayli-Kiosk")' | Set-Content "windows\CMakeLists.txt"
          (Get-Content "windows\runner\main.cpp") -replace 'window\.Create\(L"billing_app"', 'window.Create(L"Nayli Kiosk POS"' | Set-Content "windows\runner\main.cpp"
          (Get-Content "windows\runner\Runner.rc") `
            -replace 'VALUE "FileDescription", "billing_app"', 'VALUE "FileDescription", "Nayli Kiosk Desktop POS"' `
            -replace 'VALUE "ProductName", "billing_app"', 'VALUE "ProductName", "Nayli Kiosk Desktop POS"' `
            -replace 'VALUE "InternalName", "billing_app"', 'VALUE "InternalName", "Nayli-Kiosk"' `
            -replace '1,0,0,1', '2,1,0,0' `
            -replace '"1.0.0.1"', '"2.1.0.0"' `
            | Set-Content "windows\runner\Runner.rc"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Code (Build Runner)
        run: dart run build_runner build --delete-conflicting-outputs > build_runner_error.log 2>&1 || exit 0
        continue-on-error: true

      - name: Generate App Icons
        run: |
          dart run flutter_launcher_icons
          Copy-Item -Path "assets\images\app_icon.ico" -Destination "windows\runner\resources\app_icon.ico" -Force

      - name: Build Windows Executable Release
        run: flutter build windows --release

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" .github\installer\installer.iss

      - name: Archive Portable Release Folder
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\installer\Nayli-Kiosk-Desktop-Portable.zip -Force

      - name: Prepare Windows Release Assets
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "dist_windows"
          Copy-Item "build\installer\Nayli-Kiosk-Desktop-Setup.exe" -Destination "dist_windows\"
          Copy-Item "build\installer\Nayli-Kiosk-Desktop-Portable.zip" -Destination "dist_windows\"

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: dist_windows/

  publish-release:
    name: Publish Official GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: dist

      - name: Determine Tag Name
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep 'version:' pubspec.yaml | head -n1 | cut -d' ' -f2 | cut -d'+' -f1)
            echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: "🚀 Nayli Kiosk POS ${{ steps.tag_info.outputs.tag }} - تحديث رسمي"
          body: |
            ## 🎉 تحديث رسمي - نايلي كيوسك ${{ steps.tag_info.outputs.tag }}

            ${{ inputs.release_notes || '### ✅ ما الجديد في هذا الإصدار\n\n- إصلاح أخطاء برمجية متعددة وتحسين استقرار النظام\n- تحسينات في أداء نافذة بيع التبغ والمنتجات المتعددة الوحدات\n- إضافة getters للمنتجات: سعر الجملة للعلبة، سعر الكرتونة، سعر القطعة المفردة\n- تحسينات في واجهة المستخدم ومعالجة الأخطاء' }}

            ---
            ### 📥 روابط التحميل

            | الملف | الوصف |
            |-------|-------|
            | `Nayli-Kiosk-Desktop-Setup.exe` | 🖥️ برنامج التثبيت الكامل (موصى به) |
            | `Nayli-Kiosk-Desktop-Portable.zip` | 📦 النسخة المحمولة (بدون تثبيت) |

            > **للتحديث:** شغّل `Setup.exe` فوق النسخة القديمة مباشرة — بياناتك محفوظة 100%
          draft: false
          prerelease: false
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
