name: Build Windows Desktop Setup

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC C++ Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows .
          flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Executable Release
        run: flutter build windows --release

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer\installer.iss

      - name: Archive Portable Release Folder
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\installer\Nayli-Market-Desktop-Portable.zip -Force

      - name: Upload Windows Installer Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nayli-market-desktop-setup
          path: build/installer/
