name: Build Windows Desktop Setup

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup MSVC C++ Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Scaffold Windows Platform Files
        run: flutter create --platforms=windows --project-name billing_app .

      - name: Apply Custom Nayli Kiosk Branding, Icon & Executable Name
        shell: powershell
        run: |
          Copy-Item -Path "assets\images\app_icon.ico" -Destination "windows\runner\resources\app_icon.ico" -Force
          (Get-Content "windows\CMakeLists.txt") -replace 'set\(BINARY_NAME "billing_app"\)', 'set(BINARY_NAME "Nayli-Kiosk")' | Set-Content "windows\CMakeLists.txt"
          (Get-Content "windows\runner\main.cpp") -replace 'window\.Create\(L"billing_app"', 'window.Create(L"Nayli Kiosk POS"' | Set-Content "windows\runner\main.cpp"
          $rawVer = (Get-Content pubspec.yaml | Select-String -Pattern '^version:\s*([0-9\.]+)').Matches.Groups[1].Value
          if (-not $rawVer) { $rawVer = "2.4.1" }
          $vp = $rawVer.Split('.')
          $v1 = if ($vp.Count -gt 0) { $vp[0] } else { '1' }
          $v2 = if ($vp.Count -gt 1) { $vp[1] } else { '0' }
          $v3 = if ($vp.Count -gt 2) { $vp[2] } else { '0' }
          $rcComma = "$v1,$v2,$v3,0"
          $rcDot = "$v1.$v2.$v3.0"
          (Get-Content "windows\runner\Runner.rc") -replace 'VALUE "FileDescription", "billing_app"', 'VALUE "FileDescription", "Nayli Kiosk Desktop POS"' -replace 'VALUE "ProductName", "billing_app"', 'VALUE "ProductName", "Nayli Kiosk Desktop POS"' -replace 'VALUE "InternalName", "billing_app"', 'VALUE "InternalName", "Nayli-Kiosk"' -replace '1,0,0,1', $rcComma -replace '"1.0.0.1"', "`"$rcDot`"" | Set-Content "windows\runner\Runner.rc"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Code (Build Runner)
        run: dart run build_runner build --delete-conflicting-outputs
        continue-on-error: true

      - name: Generate App Icons
        run: |
          dart run flutter_launcher_icons
          Copy-Item -Path "assets\images\app_icon.ico" -Destination "windows\runner\resources\app_icon.ico" -Force

      - name: Analyze Project Code
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze_output.txt || true
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add analyze_output.txt
          git commit -m "chore: save flutter analyze output" || true
          git push || true

      - name: Build Windows Executable Release
        shell: cmd
        run: flutter build windows -v > build_log.txt 2>&1 || exit 1

      - name: Upload Build Log
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4.4.3
        with:
          name: build-log
          path: build_log.txt

      - name: Extract Error to Annotation
        if: failure()
        continue-on-error: true
        shell: powershell
        run: |
          if (Test-Path build_log.txt) {
            $err = Get-Content build_log.txt | Select-String -Pattern 'error:|Error|Exception|failed' | Select-Object -Last 20
            foreach ($line in $err) { Write-Output "::error::$line" }
          }

      - name: Generate Self-Signed Code Certificate
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -Subject "CN=Nayli Kiosk" -Type CodeSigningCert -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(5)
          $pwd = ConvertTo-SecureString -String "Nayli2026!" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "nayli_code_sign.pfx" -Password $pwd

      - name: Sign Windows Executable
        shell: cmd
        run: |
          signtool sign /f "nayli_code_sign.pfx" /p "Nayli2026!" /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 "build\windows\x64\runner\Release\Nayli-Kiosk.exe"
          

      - name: Ensure VC++ Redistributable & Resources
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "windows\redist"
          if (-not (Test-Path "windows\redist\vc_redist.x64.exe")) {
            Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "windows\redist\vc_redist.x64.exe"
          }

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" .github\installer\installer.iss

      - name: Sign Windows Installer Setup
        shell: cmd
        run: |
          signtool sign /f "nayli_code_sign.pfx" /p "Nayli2026!" /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 "build\installer\Nayli-Kiosk-Desktop-Setup.exe"

      - name: Archive Portable Release Folder
        shell: powershell
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\installer\Nayli-Kiosk-Desktop-Portable.zip -Force

      - name: Upload Windows Installer Setup Artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: nayli-kiosk-desktop-setup
          path: build/installer/
          retention-days: 1

      - name: Determine Tag Name
        id: tag_info
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -n1 | cut -d' ' -f2 | cut -d'+' -f1)
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Publish Direct Download GitHub Release
        uses: softprops/action-gh-release@v2.0.9
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: "Nayli Kiosk Desktop POS ${{ steps.tag_info.outputs.tag }} (Official Release)"
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## 🚀 Nayli Kiosk Desktop POS ${{ steps.tag_info.outputs.tag }} - التحديث الرسمي الشامل

            ### 📥 روابط التحميل المباشرة بنقرة واحدة (Direct 1-Click Downloads):
            - **[تحميل مثبت البرنامج التلقائي (Nayli-Kiosk-Desktop-Setup.exe)](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag_info.outputs.tag }}/Nayli-Kiosk-Desktop-Setup.exe)**
            - **[تحميل النسخة المحمولة بدون تثبيت (Nayli-Kiosk-Desktop-Portable.zip)](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag_info.outputs.tag }}/Nayli-Kiosk-Desktop-Portable.zip)**

            ---
            ✅ **المميزات والإصلاحات الكبرى في هذا التحديث (${{ steps.tag_info.outputs.tag }}):**
            1. **إصلاح وجهة النسخ الاحتياطي السحابي عبر تليجرام:** توجيه النسخ الاحتياطية السحابية وتقارير المبيعات اليومية حصراً إلى حساب تليجرام الشخصي للتاجر، ومنع وصول أي ملفات أو تقارير إلى حساب المطور.
            2. **عزل وتطهير معرف المطور:** تصفية وتنظيف أي أثر لمعرف المطور من أجهزة التجار تلقائياً، مع حظر برمجي صارم يمنع إرسال أو حفظ النسخ الاحتياطية لمطوري النظام.
            3. **إتاحة إدخال وتعديل معرّف تليجرام (Chat ID) يدوياً:** استعادة خانة إدخال المعرف المباشر في صفحة النسخ الاحتياطي، مع دعم الكشف التلقائي بنقرة واحدة وربط الجهاز بالبوت المعتمد.
            4. **فحص فوري لإرسال نسخة احتياطية تجريبية (.zip):** ميزة تجربة إرسال ملف النسخة الاحتياطية بنقرة واحدة ليتأكد التاجر من وصول الملف المشفر مباشرة إلى هاتفه.
            5. **دقة محاسبية كاملة وتدقيق بأثر رجعي:** استمرار ميزات التدقيق التلقائي لصافي المقبوضات النقدية وعزل مدفوعات البطاقة والكريدي بدقة 100%.
          files: |
            build/installer/Nayli-Kiosk-Desktop-Setup.exe
            build/installer/Nayli-Kiosk-Desktop-Portable.zip
