name: nayli_market_desktop
description: "Nayli Market Desktop - High-Performance Retail & Wholesale POS System for Windows & Multi-Platform"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management & DI
  flutter_bloc: ^8.1.5
  get_it: ^7.6.7
  equatable: ^2.0.5
  
  # Functional Programming & CodeGen Annotations
  fpdart: ^1.1.0
  json_annotation: ^4.9.0
  
  # Navigation
  go_router: ^14.0.0
  
  # High-Speed Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI, Fonts & Formatting
  google_fonts: ^6.1.0
  intl: ^0.19.0
  uuid: ^4.5.2
  path_provider: ^2.1.3
  
  # Sound & Multimedia (Costco Acoustic Engine)
  audioplayers: ^6.0.0
  
  # QR Codes for BaridiPay & Digital Payments
  qr_flutter: ^4.1.0
  
  # Crypto for Secure Hashing & Licenses
  crypto: ^3.0.3
  
  # Embedded LAN Master Server (Local Multi-Terminal Sync)
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  
  # Cross-Platform Hardware & Utilities
  share_plus: ^10.0.0
  image_picker: ^1.1.2
  vibration: ^3.1.8
  permission_handler: ^11.3.1
  print_bluetooth_thermal: ^1.1.2
  mobile_scanner: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/

